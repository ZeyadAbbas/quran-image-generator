# Working example for Quran Image Generator. These are sample values, not a
# duplicate of every built-in default. See docs/configuration.md for the
# canonical defaults, accepted values, and path rules.
#
# Optional Instagram credentials belong in environment variables, never here.
# Quran content needs no account, key, or secret.

'output path': outputs
'resolution': '1080 x 1080'
'background image': ''
'background color': '#101820'

'quran font': assets/fonts/quran_font.ttf
'quran color': '#FFFFFF'
'quran font size': 38
'quran x position': center
'quran maximum width': 900
'quran line spacing': 30
'quran word spacing': 6
'quran letter spacing': -0.1
'quran and translation spacing': 34

# Discover current resources with `quran-image-generator --list-translations`.
# Select up to three exact QuranEnc keys in display order. An empty list gives
# an Arabic-only image and works entirely from the bundled Tanzil text.
#
# 'translation languages':
#   - key: english_saheeh
#     font size: 18
#   - key: french_montada
#     font: Arial
'translation languages': []
'translation color': '#E8E8E8'
'translation font size': 18
'translation x position': center
'translation maximum width': 860
'translation language spacing': 12
'translation line spacing': 10
'translation word spacing': 1
'translation letter spacing': 0.0

'show verse numbers': true
'verse number resolution': '55 x 55'
'verse number x offset': 10
'verse number y offset': -20
'space between verses': 70
'generate random verses': false
'total y offset': -10
